<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>保险手续费测算计算器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .content {
            padding: 30px;
        }

        .section {
            margin-bottom: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 12px;
            border-left: 4px solid #667eea;
        }

        .section-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 15px;
            color: #667eea;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
            color: #555;
        }

        .input-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .settings-toggle {
            display: inline-block;
            margin-bottom: 15px;
            cursor: pointer;
            color: #667eea;
            font-size: 14px;
            user-select: none;
        }

        .settings-toggle:hover {
            text-decoration: underline;
        }

        .settings-panel {
            display: none;
            margin-top: 15px;
            padding: 15px;
            background: white;
            border-radius: 8px;
        }

        .settings-panel.active {
            display: block;
        }

        .settings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .settings-grid .input-group {
            margin-bottom: 0;
        }

        .settings-grid input {
            padding: 10px 12px;
            font-size: 14px;
        }

        .calculate-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .calculate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        .calculate-btn:active {
            transform: translateY(0);
        }

        .result-section {
            display: none;
            margin-top: 30px;
        }

        .result-section.active {
            display: block;
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            margin-bottom: 10px;
            background: white;
            border-radius: 8px;
            border-left: 3px solid #667eea;
        }

        .result-item.total {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-left: none;
            font-weight: 600;
            font-size: 18px;
        }

        .result-label {
            font-size: 15px;
        }

        .result-value {
            font-size: 18px;
            font-weight: 600;
            color: #667eea;
        }

        .result-item.total .result-value {
            color: white;
            font-size: 22px;
        }

        .reset-btn {
            width: 100%;
            padding: 12px;
            background: #f0f0f0;
            color: #666;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.3s;
        }

        .reset-btn:hover {
            background: #e0e0e0;
        }

        .formula-note {
            font-size: 12px;
            color: #999;
            margin-top: 8px;
            line-height: 1.6;
        }

        @media (max-width: 600px) {
            body {
                padding: 10px;
            }

            .header h1 {
                font-size: 22px;
            }

            .content {
                padding: 20px 15px;
            }

            .section {
                padding: 15px;
            }

            .settings-grid {
                grid-template-columns: 1fr;
            }

            .result-item {
                padding: 12px;
            }

            .result-label {
                font-size: 14px;
            }

            .result-value {
                font-size: 16px;
            }

            .result-item.total .result-value {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>保险手续费测算计算器</h1>
            <p>快速计算各类保险手续费</p>
        </div>

        <div class="content">
            <!-- 保费输入区 -->
            <div class="section">
                <div class="section-title">保费输入</div>
                
                <div class="input-group">
                    <label for="jiaoqiangxian">交强险保费（元）</label>
                    <input type="number" id="jiaoqiangxian" placeholder="请输入交强险保费" step="0.01" min="0">
                    <div class="formula-note">手续费 = 保费 ÷ 1.06 × 0.04 ÷ 1.0677</div>
                </div>

                <div class="input-group">
                    <label for="shangyexian">商业险保费（元）</label>
                    <input type="number" id="shangyexian" placeholder="请输入商业险保费" step="0.01" min="0">
                    <div class="formula-note">基础手续费 = 保费 ÷ 1.06 × 0.12 ÷ 1.0677<br>加投手续费 = 保费 ÷ 1.06 × 0.2 × 0.89</div>
                </div>

                <div class="input-group">
                    <label for="jiachengxian">驾乘险保费（元）</label>
                    <input type="number" id="jiachengxian" placeholder="请输入驾乘险保费" step="0.01" min="0">
                    <div class="formula-note">手续费 = 保费 ÷ 1.06 × 0.4 ÷ 1.0677</div>
                </div>
            </div>

            <!-- 税率设置 -->
            <div class="section">
                <div class="section-title">税率设置</div>
                <div class="settings-toggle" onclick="toggleSettings()">
                    ▼ 点击展开/收起税率参数
                </div>
                
                <div class="settings-panel" id="settingsPanel">
                    <div class="settings-grid">
                        <div class="input-group">
                            <label for="vatRate">增值税率</label>
                            <input type="number" id="vatRate" value="1.06" step="0.01" min="1">
                        </div>
                        
                        <div class="input-group">
                            <label for="附加税率">附加税调整系数</label>
                            <input type="number" id="附加税率" value="1.0677" step="0.0001" min="1">
                        </div>

                        <div class="input-group">
                            <label for="交强险费率">交强险手续费率</label>
                            <input type="number" id="交强险费率" value="0.04" step="0.01" min="0">
                        </div>

                        <div class="input-group">
                            <label for="商业险基础费率">商业险基础手续费率</label>
                            <input type="number" id="商业险基础费率" value="0.12" step="0.01" min="0">
                        </div>

                        <div class="input-group">
                            <label for="商业险加投费率">商业险加投手续费率</label>
                            <input type="number" id="商业险加投费率" value="0.2" step="0.01" min="0">
                        </div>

                        <div class="input-group">
                            <label for="加投系数">加投系数</label>
                            <input type="number" id="加投系数" value="0.89" step="0.01" min="0">
                        </div>

                        <div class="input-group">
                            <label for="驾乘险费率">驾乘险手续费率</label>
                            <input type="number" id="驾乘险费率" value="0.4" step="0.01" min="0">
                        </div>
                    </div>
                </div>
            </div>

            <!-- 计算按钮 -->
            <button class="calculate-btn" onclick="calculate()">计算手续费</button>

            <!-- 结果展示区 -->
            <div class="result-section" id="resultSection">
                <div class="section">
                    <div class="section-title">计算结果</div>
                    
                    <div class="result-item">
                        <span class="result-label">交强险手续费</span>
                        <span class="result-value" id="resultJiaoqiangxian">¥0.00</span>
                    </div>

                    <div class="result-item">
                        <span class="result-label">商业险基础手续费</span>
                        <span class="result-value" id="resultShangyeBase">¥0.00</span>
                    </div>

                    <div class="result-item">
                        <span class="result-label">商业险加投手续费</span>
                        <span class="result-value" id="resultShangyeExtra">¥0.00</span>
                    </div>

                    <div class="result-item">
                        <span class="result-label">驾乘险手续费</span>
                        <span class="result-value" id="resultJiacheng">¥0.00</span>
                    </div>

                    <div class="result-item total">
                        <span class="result-label">总手续费</span>
                        <span class="result-value" id="resultTotal">¥0.00</span>
                    </div>

                    <button class="reset-btn" onclick="resetForm()">重置</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function toggleSettings() {
            const panel = document.getElementById('settingsPanel');
            panel.classList.toggle('active');
        }

        function calculate() {
            // 获取保费输入
            const jiaoqiangxian = parseFloat(document.getElementById('jiaoqiangxian').value) || 0;
            const shangyexian = parseFloat(document.getElementById('shangyexian').value) || 0;
            const jiachengxian = parseFloat(document.getElementById('jiachengxian').value) || 0;

            // 获取税率参数
            const vatRate = parseFloat(document.getElementById('vatRate').value) || 1.06;
            const 附加税率 = parseFloat(document.getElementById('附加税率').value) || 1.0677;
            const 交强险费率 = parseFloat(document.getElementById('交强险费率').value) || 0.04;
            const 商业险基础费率 = parseFloat(document.getElementById('商业险基础费率').value) || 0.12;
            const 商业险加投费率 = parseFloat(document.getElementById('商业险加投费率').value) || 0.2;
            const 加投系数 = parseFloat(document.getElementById('加投系数').value) || 0.89;
            const 驾乘险费率 = parseFloat(document.getElementById('驾乘险费率').value) || 0.4;

            // 计算各项手续费
            const jiaoqiangxianFee = jiaoqiangxian / vatRate * 交强险费率 / 附加税率;
            const shangyeBaseFee = shangyexian / vatRate * 商业险基础费率 / 附加税率;
            const shangyeExtraFee = shangyexian / vatRate * 商业险加投费率 * 加投系数;
            const jiachengFee = jiachengxian / vatRate * 驾乘险费率 / 附加税率;

            // 计算总费用
            const totalFee = jiaoqiangxianFee + shangyeBaseFee + shangyeExtraFee + jiachengFee;

            // 显示结果
            document.getElementById('resultJiaoqiangxian').textContent = '¥' + jiaoqiangxianFee.toFixed(2);
            document.getElementById('resultShangyeBase').textContent = '¥' + shangyeBaseFee.toFixed(2);
            document.getElementById('resultShangyeExtra').textContent = '¥' + shangyeExtraFee.toFixed(2);
            document.getElementById('resultJiacheng').textContent = '¥' + jiachengFee.toFixed(2);
            document.getElementById('resultTotal').textContent = '¥' + totalFee.toFixed(2);

            // 显示结果区域
            document.getElementById('resultSection').classList.add('active');
            
            // 滚动到结果区域
            setTimeout(() => {
                document.getElementById('resultSection').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }, 100);
        }

        function resetForm() {
            document.getElementById('jiaoqiangxian').value = '';
            document.getElementById('shangyexian').value = '';
            document.getElementById('jiachengxian').value = '';
            document.getElementById('resultSection').classList.remove('active');
        }

        // 支持回车键触发计算
        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                calculate();
            }
        });
    </script>
</body>
</html>
